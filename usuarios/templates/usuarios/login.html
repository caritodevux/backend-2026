{% extends 'usuarios/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Iniciar Sesión</h4>
            </div>
            <div class="card-body">
                <!-- Alerta de error en credenciales -->
                {% if form.errors %}
                    <div class="alert alert-danger py-2 text-center" role="alert">
                        <small>Usuario o contraseña incorrectos. Inténtalo de nuevo.</small>
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" name="password" id="id_password" class="form-control" required>
                            <button class="btn btn-outline-secondary" type="button" id="btnToggleLoginPass">
                                <i class="bi bi-eye" id="iconLoginPass"></i>
                            </button>
                        </div>
                    </div>

                    <script>
                        document.getElementById('btnToggleLoginPass')?.addEventListener('click', function () {
                            const input = document.getElementById('id_password');
                            const icon = document.getElementById('iconLoginPass');

                            if (input.type === 'password') {
                                input.type = 'text';
                                icon.classList.remove('bi-eye');
                                icon.classList.add('bi-eye-slash');
                            } else {
                                input.type = 'password';
                                icon.classList.remove('bi-eye-slash');
                                icon.classList.add('bi-eye');
                            }
                        });
                    </script>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
